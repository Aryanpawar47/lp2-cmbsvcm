<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
      <h1>Event Explorer application</h1>

      <input id="search" placeholder="Serach event " oninput="show()">

       <select id="category" onchange="show()">
        <option value="">All Categories</option>
        <option value="Tech">Tech</option>
        <option value="Music">Music</option>
        <option value="Sports">Sports</option>
    </select>

      <input type="date" id="date" onchange="show()">

      <select id="sort" onchange="show()">
          <option value="">Sort by</option>
          <option value="asc">Earlier</option>
          <option value="desc">Latest</option>
      </select>

      <div id="events"></div>

      <script src="script.js"></script>

</body>
</html>
