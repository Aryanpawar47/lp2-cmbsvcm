
<!DOCTYPE html>
<html>
<head>
    <title>Div and Span Timetable</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: lightblue;
        }

        .box {
            background: white;
            border: 1px solid black;
            padding: 15px;
            margin: 10px auto;
            width: 70%;
            border-radius: 5px;
        }

        span {
            color: blue;
            font-weight: bold;
        }

        img, video {
            max-width: 100%;
        }
    </style>
</head>
<body>

<h1>Computer Engineering Department</h1>
<h2>Weekly Class Timetable</h2>

<div class="box">
    Monday: <span>Maths, Python Lab</span>
</div>

<div class="box">
    Tuesday: <span>Physics, Maths, English</span>
</div>

<div class="box">
    Wednesday: <span>Project</span>
</div>

<div class="box">
    Thursday: <span>Maths, Python, Physics</span>
</div>

<div class="box">
    Friday: <span>English, Maths, Python</span>
</div>

<div class="box">
    Saturday: <span>Maths, Python, Practical</span>
</div>



</body>
</html>
